name: CI

# This repo had no CI. `npx eslint src/` had drifted to 18 errors and `tsc` was only ever run by
# hand, because the sole PR check was Vercel's build — and `next build` runs neither. So a lint
# regression could reach production with every check green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # AJA-298: next@16.2.10 and @capacitor/ios@8.4.1 sat on critical advisories with every check
      # green, because nothing here looked. Production deps only; high and above fails the run.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Types
        run: npx tsc --noEmit

      # A ratchet, not a clean bill of health: 15 known react-hooks/set-state-in-effect errors are
      # frozen in lint-baseline.json and tracked in AJA-295. This fails when the count goes UP.
      # Fixing them blind is the risk it exists to avoid — that rule governs render timing, and two
      # bugs shipped this week (AJA-282, AJA-294) were exactly that failure mode.
      - name: Lint (no new errors)
        run: node scripts/lint-baseline.mjs

      # Every suite that runs without secrets. `test:image-refs` is deliberately absent: it scans
      # the live database with the service-role key and fails loudly rather than skipping when the
      # key is missing, which is correct for a safety check and wrong for CI. Run it locally.
      - name: Tests
        run: |
          npm run test:rules
          npm run test:feedback
          npm run test:taste
          npm run test:taste-feed
          npm run test:taste-undo
          npm run test:smart-buy
          npm run test:visual-dupes
          npm run test:visual-embed-server
          npm run test:visual-index
          npm run test:context
          npm run test:storage
          npm run test:render
          npm run test:tryon-photo
          npm run test:samples
          npm run test:face
          npm run test:item-images
          npm run test:onboarding
          npm run test:trip-errors
          npm run test:shared-closet-errors

      - name: Build
        run: npm run build
        env:
          # Build-time only; the app reads real values from Vercel at runtime. Present so the
          # build doesn't take a "Supabase not configured" path that differs from production.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
