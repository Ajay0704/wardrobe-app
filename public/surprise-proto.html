<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise me — prototype (AJA-248)</title>
<style>
  :root {
    --bg: #0d0d0f; --card: #17171b; --card2: #1f1f25; --line: #2b2b33;
    --fg: #f4f4f6; --dim: #9a9aa6; --dimmer: #6b6b78;
    --good: #34d399; --warn: #fbbf24; --bad: #f87171; --accent: #a78bfa;
    --safe: #60a5fa; --elev: #a78bfa; --exp: #fbbf24;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fafafa; --card:#fff; --card2:#f3f3f5; --line:#e4e4e8;
            --fg:#18181b; --dim:#6b6b78; --dimmer:#9a9aa6; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(env(safe-area-inset-top), 16px) 16px calc(env(safe-area-inset-bottom) + 40px);
    max-width: 1180px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .sub b { color: var(--fg); font-weight: 600; }
  .banner {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 18px; font-size: 13px; color: var(--dim);
  }
  .banner.err { border-color: var(--bad); }
  .banner code { background: var(--card2); padding: 1px 5px; border-radius: 4px; color: var(--fg); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  .grp { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line);
         padding: 4px; border-radius: 999px; }
  .chip {
    border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 13px;
    padding: 6px 13px; border-radius: 999px; cursor: pointer; transition: .15s;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
  .chip:active { transform: scale(.94); }
  .go {
    border: 0; background: var(--accent); color: #16121f; font: inherit; font-weight: 700;
    padding: 10px 20px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .go:active { transform: scale(.96); }
  .temp { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  .temp input { width: 110px; accent-color: var(--accent); }

  .cols { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 22px; }
  @media (min-width: 900px) { .cols { grid-template-columns: minmax(0,0.9fr) minmax(0,1.35fr); } }
  .panel { min-width: 0; }
  .phead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .phead h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; margin: 0; color: var(--dim); }
  .phead .tag { font-size: 11px; color: var(--dimmer); }

  .look { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 14px; margin-bottom: 12px; }
  .look.now { border-style: dashed; }
  .lhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .slot { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          padding: 3px 9px; border-radius: 999px; }
  .slot.Safe { background: color-mix(in srgb, var(--safe) 20%, transparent); color: var(--safe); }
  .slot.Elevated { background: color-mix(in srgb, var(--elev) 20%, transparent); color: var(--elev); }
  .slot.Experimental { background: color-mix(in srgb, var(--exp) 20%, transparent); color: var(--exp); }
  .slot.old { background: var(--card2); color: var(--dim); }
  .blurb { font-size: 12px; color: var(--dimmer); }
  .score { margin-left: auto; font-size: 12px; color: var(--dimmer); font-variant-numeric: tabular-nums; }

  .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .it { flex: 0 0 92px; }
  /* Garment images are transparent-background cutouts, so the tile must stay
     light in both themes or a dark garment vanishes into the card. */
  .it .ph {
    width: 92px; height: 112px; border-radius: 10px; background: #f4f4f6;
    display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line);
  }
  .it img { width: 100%; height: 100%; object-fit: contain; }
  .it .nm { font-size: 10.5px; line-height: 1.25; margin-top: 5px; color: var(--fg);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .it .at { font-size: 9.5px; color: var(--dimmer); margin-top: 1px; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
            vertical-align: -1px; margin-right: 3px; border: 1px solid var(--line); }

  .why { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .why div { font-size: 12px; color: var(--dim); }
  .why b { color: var(--fg); font-weight: 600; font-size: 11px; text-transform: uppercase;
           letter-spacing: .05em; margin-right: 6px; }

  .sig { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .sig span { font-size: 10px; padding: 2px 7px; border-radius: 5px; background: var(--card2);
              color: var(--dim); font-variant-numeric: tabular-nums; }

  .diag { margin-top: 26px; background: var(--card); border: 1px solid var(--line);
          border-radius: 16px; padding: 16px; }
  .diag h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
             color: var(--dim); margin: 0 0 12px; }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12.5px; }
  .bar .lab { flex: 0 0 auto; color: var(--dim); min-width: 0; }
  .bar .track { flex: 1; height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; min-width: 40px; }
  .bar .fill { height: 100%; background: var(--bad); border-radius: 99px; }
  .bar .n { flex: 0 0 auto; color: var(--dimmer); font-variant-numeric: tabular-nums; }
  .note { font-size: 11.5px; color: var(--dimmer); margin-top: 12px; line-height: 1.5; }
  .empty { color: var(--dimmer); font-size: 13px; padding: 18px 0; }
  textarea { width: 100%; height: 90px; background: var(--card2); color: var(--fg);
             border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px;
             font-family: ui-monospace, monospace; }
</style>
</head>
<body>

<h1>Surprise me — prototype</h1>
<div class="sub" id="sub">Loading your closet…</div>

<div class="banner" id="banner" hidden></div>

<div class="controls">
  <div class="grp" id="seasons"></div>
  <div class="grp" id="occasions"></div>
</div>
<div class="controls" style="margin-top:8px">
  <label class="temp">Temp <input type="range" id="temp" min="-5" max="38" value="27"><b id="tempv">27°C</b></label>
  <div class="grp"><button class="chip" id="coat" aria-pressed="false">Needs a coat</button></div>
  <button class="go" id="go">Surprise me</button>
</div>

<div class="cols">
  <div class="panel">
    <div class="phead">
      <h2>Now — what ships today</h2>
      <span class="tag">bestLook(owned, {})</span>
    </div>
    <div id="now"></div>
  </div>
  <div class="panel">
    <div class="phead">
      <h2>Proposed — filtered, scored, diversified</h2>
      <span class="tag">3 looks, one candidate pool</span>
    </div>
    <div id="new"></div>
  </div>
</div>

<div class="diag">
  <h3>What the filters threw out this run</h3>
  <div id="rejects"></div>
  <div class="note" id="dnote"></div>
</div>

<script src="./surprise-proto.js"></script>
<script src="./surprise-proto-ui.js"></script>
</body>
</html>
